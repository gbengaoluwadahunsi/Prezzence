plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file('release/signing.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def envOrProp = { String name, String fallback = "" ->
    (findProperty(name) ?: System.getenv(name) ?: signingProps.getProperty(name) ?: fallback).toString()
}

def playApplicationId = envOrProp('PREZZENCE_PLAY_APPLICATION_ID', 'com.pollecode.prezzencekotlin')
def prezzenceVersionCode = envOrProp('PREZZENCE_VERSION_CODE', '1').toInteger()
def prezzenceVersionName = envOrProp('PREZZENCE_VERSION_NAME', '0.1.0')
def prezzenceApiUrl = envOrProp('PREZZENCE_API_URL', 'https://prezzence-backend.onrender.com')
def supabaseUrl = (findProperty('PREZZENCE_SUPABASE_URL') ?: System.getenv('EXPO_PUBLIC_SUPABASE_URL') ?: System.getenv('SUPABASE_URL') ?: "").toString()
def supabaseAnonKey = (findProperty('PREZZENCE_SUPABASE_ANON_KEY') ?: System.getenv('EXPO_PUBLIC_SUPABASE_ANON_KEY') ?: System.getenv('SUPABASE_ANON_KEY') ?: "").toString()
def releaseStoreFile = envOrProp('PREZZENCE_UPLOAD_STORE_FILE', '')
def releaseStorePassword = envOrProp('PREZZENCE_UPLOAD_STORE_PASSWORD', '')
def releaseKeyAlias = envOrProp('PREZZENCE_UPLOAD_KEY_ALIAS', '')
def releaseKeyPassword = envOrProp('PREZZENCE_UPLOAD_KEY_PASSWORD', '')
def prezzenceSubscriptionProductId = envOrProp('PREZZENCE_SUBSCRIPTION_PRODUCT_ID', 'prezzence_pro')
def prezzenceWeekPassProductId = envOrProp('PREZZENCE_WEEK_PASS_PRODUCT_ID', 'prezzence_week')
def playCloudProjectNumber = envOrProp('PREZZENCE_PLAY_CLOUD_PROJECT_NUMBER', '730307820828')
def duixModelBaseUrl = envOrProp('DUIX_MODEL_BASE_URL', '')
def releaseStorePath = releaseStoreFile ? rootProject.file(releaseStoreFile) : null

def escapeBuildConfig = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.pollecode.prezzencekotlin'
    compileSdk 36

    defaultConfig {
        applicationId playApplicationId
        minSdk 24
        targetSdk 36
        versionCode prezzenceVersionCode
        versionName prezzenceVersionName
        buildConfigField 'String', 'PREZZENCE_API_URL', "\"${escapeBuildConfig(prezzenceApiUrl)}\""
        buildConfigField 'String', 'PREZZENCE_SUPABASE_URL', "\"${escapeBuildConfig(supabaseUrl)}\""
        buildConfigField 'String', 'PREZZENCE_SUPABASE_ANON_KEY', "\"${escapeBuildConfig(supabaseAnonKey)}\""
        buildConfigField 'String', 'PREZZENCE_SUBSCRIPTION_PRODUCT_ID', '"' + escapeBuildConfig(prezzenceSubscriptionProductId) + '"'
        buildConfigField 'String', 'PREZZENCE_WEEK_PASS_PRODUCT_ID', '"' + escapeBuildConfig(prezzenceWeekPassProductId) + '"'
        buildConfigField 'String', 'PREZZENCE_VERSION_NAME', "\"${prezzenceVersionName}\""
        buildConfigField 'String', 'DEBUG_DUIX_MODEL_BASE_URL', "\"${escapeBuildConfig(duixModelBaseUrl)}\""
        buildConfigField 'long', 'PLAY_CLOUD_PROJECT_NUMBER', "${playCloudProjectNumber}L"
    }

    signingConfigs {
        release {
            if (releaseStorePath != null) storeFile releaseStorePath
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseStorePath != null && releaseStorePath.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        buildConfig true
        compose true
    }
}

tasks.register('verifyPrezzenceReleaseEnv') {
    group = 'verification'
    description = 'Verifies Play Store, Supabase, backend, and signing inputs for a production Kotlin release.'
    doLast {
        def failures = []
        def allowedPlayIds = ['com.pollecode.prezzencekotlin', 'com.pollecode.prezzence']
        if (!allowedPlayIds.contains(playApplicationId)) {
            failures << "PREZZENCE_PLAY_APPLICATION_ID must be com.pollecode.prezzencekotlin or com.pollecode.prezzence. Current: ${playApplicationId}"
        }
        if (!prezzenceApiUrl.startsWith('https://')) failures << 'PREZZENCE_API_URL must be an HTTPS production backend URL.'
        if (!supabaseUrl.startsWith('https://')) failures << 'PREZZENCE_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_URL is missing or not HTTPS.'
        if (supabaseAnonKey.length() < 20) failures << 'PREZZENCE_SUPABASE_ANON_KEY / EXPO_PUBLIC_SUPABASE_ANON_KEY is missing or too short.'
        if (releaseStorePath == null || !releaseStorePath.exists()) failures << 'PREZZENCE_UPLOAD_STORE_FILE must point to the release keystore.'
        if (!releaseStorePassword) failures << 'PREZZENCE_UPLOAD_STORE_PASSWORD is missing.'
        if (!releaseKeyAlias) failures << 'PREZZENCE_UPLOAD_KEY_ALIAS is missing.'
        if (!releaseKeyPassword) failures << 'PREZZENCE_UPLOAD_KEY_PASSWORD is missing.'
        if (!prezzenceSubscriptionProductId.trim()) failures << 'PREZZENCE_SUBSCRIPTION_PRODUCT_ID is missing.'
        if (!failures.isEmpty()) throw new GradleException('Prezzence Kotlin release env is not ready:\n - ' + failures.join('\n - '))
        println 'Prezzence Kotlin release env verified.'
    }
}

dependencies {
    implementation project(':duix-sdk')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    implementation 'com.google.android.play:integrity:1.4.0'
    // Firebase Crashlytics
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
}


